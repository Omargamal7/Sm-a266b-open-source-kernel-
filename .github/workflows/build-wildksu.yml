name: Build WildKSU Kernel (SM-A266B)

on:
  push:
    branches: [ main, wildksu ]
  pull_request:
    branches: [ main, wildksu ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            build-essential \
            kmod dwarves \
            rsync zip unzip \
            clang llvm lld device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio gzip xz-utils

      - name: Download x86_64 magiskboot for boot image repacking
        run: |
          echo "Downloading magiskboot for x86_64..."
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip -q magisk.zip lib/x86_64/libmagiskboot.so -d magisk_extract
          mv magisk_extract/lib/x86_64/libmagiskboot.so kernel/opensource/tools/magiskboot_x64
          chmod +x kernel/opensource/tools/magiskboot_x64
          rm -rf magisk.zip magisk_extract
          echo "magiskboot for x86_64 downloaded successfully"

      - name: Apply WildKSU / SUSFS patches
        working-directory: kernel/opensource
        run: |
          set -e
          if [ -f ../../wildksu/10_enable_susfs_for_ksu.patch ]; then
            echo "Applying KernelSU SUSFS patch..."
            patch -p1 < ../../wildksu/10_enable_susfs_for_ksu.patch || echo "Patch may already be applied or failed"
          fi
          
          # Apply any other patches from wildksu directory
          shopt -s nullglob
          for p in ../../wildksu/**/*.patch; do
            if [ -f "$p" ] && [ "$p" != "../../wildksu/10_enable_susfs_for_ksu.patch" ]; then
              echo "Applying patch: $p"
              patch -p1 < "$p" || true
            fi
          done
          shopt -u nullglob

      - name: Build kernel
        working-directory: kernel/opensource
        run: |
          chmod +x build_kernel_gha.sh
          ./build_kernel_gha.sh

      - name: Unpack init_boot.img
        working-directory: kernel/opensource
        run: |
          if [ -f init_boot.img ]; then
            echo "Unpacking init_boot.img..."
            mkdir -p init_boot_repack
            cd init_boot_repack
            ../tools/magiskboot_x64 unpack ../init_boot.img
            ls -la
          else
            echo "Warning: init_boot.img not found"
          fi

      - name: Repack init_boot.img with patched kernel
        working-directory: kernel/opensource
        run: |
          if [ -d init_boot_repack ]; then
            echo "Repacking init_boot.img with patched kernel..."
            cd init_boot_repack
            
            # Replace kernel image
            if [ -f ../arch/arm64/boot/Image.gz ]; then
              cp ../arch/arm64/boot/Image.gz ./kernel
              echo "Using compressed kernel Image.gz"
            elif [ -f ../arch/arm64/boot/Image ]; then
              cp ../arch/arm64/boot/Image ./kernel
              echo "Using uncompressed kernel Image"
            elif [ -f ../Image ]; then
              cp ../Image ./kernel
              echo "Using kernel Image from root"
            fi
            
            # Repack the image
            ../tools/magiskboot_x64 repack ../init_boot.img
            mv new-boot.img ../init_boot_patched.img
            echo "Repacked init_boot.img successfully!"
            ls -lh ../init_boot_patched.img
          fi

      - name: Package AnyKernel3
        run: |
          OUT="$GITHUB_WORKSPACE/output"
          mkdir -p "$OUT"

          cp kernel/opensource/anykernel.sh "$OUT/"
          cp -r kernel/opensource/tools "$OUT/"
          cp -r kernel/opensource/META-INF "$OUT/"

          if [ -f kernel/opensource/arch/arm64/boot/Image.gz ]; then
            cp kernel/opensource/arch/arm64/boot/Image.gz "$OUT/kernel"
          else
            cp kernel/opensource/arch/arm64/boot/Image "$OUT/kernel"
          fi

          cd "$OUT"
          zip -r9 WildKSU-A26-AnyKernel.zip .

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/opensource/arch/arm64/boot/Image*

      - name: Upload patched init_boot.img
        if: hashFiles('kernel/opensource/init_boot_patched.img') != ''
        uses: actions/upload-artifact@v4
        with:
          name: init_boot_patched
          path: kernel/opensource/init_boot_patched.img

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: WildKSU-A26-AnyKernel
          path: output/WildKSU-A26-AnyKernel.zip
