name: Build Samsung Galaxy A26 Kernel (KernelSU)

on:
  push:
    branches:
      - Wildksu
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential libc6-dev libncurses-dev \
            libssl-dev libelf-dev dwarves rsync python3 \
            clang llvm lld device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio gzip xz-utils unzip zip

      - name: Apply KernelSU patches
        working-directory: kernel/opensource
        run: |
          if [ -f ../../wildksu/10_enable_susfs_for_ksu.patch ]; then
            echo "Applying KernelSU SUSFS patch..."
            patch -p1 < ../../wildksu/10_enable_susfs_for_ksu.patch || echo "Patch may already be applied or failed"
          fi

      - name: Build kernel
        working-directory: kernel/opensource
        run: |
          chmod +x build_kernel_gha.sh
          ./build_kernel_gha.sh

      - name: Unpack init_boot.img
        working-directory: kernel/opensource
        run: |
          if [ -f init_boot.img ]; then
            echo "Unpacking init_boot.img..."
            mkdir -p init_boot_repack
            cd init_boot_repack
            ../tools/magiskboot unpack ../init_boot.img
            ls -la
          else
            echo "Warning: init_boot.img not found, skipping repack"
          fi

      - name: Repack init_boot.img with new kernel
        working-directory: kernel/opensource
        run: |
          if [ -d init_boot_repack ]; then
            echo "Repacking init_boot.img with patched kernel..."
            cd init_boot_repack
            
            # Replace kernel image
            if [ -f ../arch/arm64/boot/Image.gz ]; then
              cp ../arch/arm64/boot/Image.gz ./kernel
              echo "Using compressed kernel Image.gz"
            elif [ -f ../arch/arm64/boot/Image ]; then
              cp ../arch/arm64/boot/Image ./kernel
              echo "Using uncompressed kernel Image"
            elif [ -f ../Image ]; then
              cp ../Image ./kernel
              echo "Using kernel Image from root"
            fi
            
            # Repack the image
            ../tools/magiskboot repack ../init_boot.img
            mv new-boot.img ../init_boot_patched.img
            echo "Repacked init_boot.img successfully!"
            ls -lh ../init_boot_patched.img
          else
            echo "Warning: init_boot_repack directory not found, skipping repack"
          fi

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-a26-build
          path: |
            kernel/opensource/Image
            kernel/opensource/arch/arm64/boot/dts/**/*.dtb
            kernel/opensource/arch/arm64/boot/Image*

      - name: Upload patched init_boot.img
        if: hashFiles('kernel/opensource/init_boot_patched.img') != ''
        uses: actions/upload-artifact@v4
        with:
          name: init_boot_patched
          path: kernel/opensource/init_boot_patched.img
